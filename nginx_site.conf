# ==============================================================================
# RiceVision HMI - Production Nginx Reverse Proxy Configuration
# Public Ports: 80 (HTTP redirect to 443) -> 443 (HTTPS TLS 1.3)
# Backend Application: http://127.0.0.1:11111 (RiceVision Python HMI Server)
# ==============================================================================

# HTTP Server (Port 80) -> Redirects all plain HTTP requests to HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name kakashihatake.store www.kakashihatake.store adisys.kakashihatake.store;

    # Let's Encrypt ACME challenge location for automatic certbot renewals
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server (Port 443) -> Forwards SSL traffic to RiceVision Backend (Port 11111)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kakashihatake.store www.kakashihatake.store adisys.kakashihatake.store;

    # Let's Encrypt TLS Certificates
    ssl_certificate /etc/letsencrypt/live/adisys.kakashihatake.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adisys.kakashihatake.store/privkey.pem;

    # Strict TLS Protocols (TLS 1.3 enforced, TLS 1.2 compatible)
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 20M;

    # Allow browser camera access over HTTPS
    add_header Permissions-Policy "camera=(self)" always;

    # Forward all requests to RiceVision HMI application running on port 11111
    location / {
        proxy_pass http://127.0.0.1:11111;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
}
